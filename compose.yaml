services:
  server:
    build: server/
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
        restart: true
      oauth:
        condition: service_healthy
        restart: true
#      oauth:
#        condition: service_healthy
#        restart: true
#  web:
#    build: web/
#    ports:
#      - "5173:5173"
#    depends_on:
#      server:
#        condition: service_healthy
#        restart: false
  database:
    image: postgres:18
    container_name: database
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: annotator
      POSTGRES_PASSWORD: annotator
      POSTGRES_DB: annotator
      POSTGRES_HOST: database
    volumes:
      - ./postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U annotator -d annotator'"]
      interval: 10s
      timeout: 3s
      retries: 3
  oauth:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: oauth
    ports:
      - "8080:8080"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak_data:/opt/keycloak/data
    environment:
      KC_HOSTNAME: http://oauth:8080
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HOSTNAME_DYNAMIC_BACKCHANNEL: true
      KC_HTTP_RELATIVE_PATH: /
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_LOG_LEVEL: info
      KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_SOCKET_TIMEOUT_MILLIS: 30000
    healthcheck:
      test: ["CMD-SHELL", "exec 3<> /dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\nhost: http://localhost\\nConnection: close\\n\\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30
