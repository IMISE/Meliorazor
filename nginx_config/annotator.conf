server {
    listen ${HTTPS_PORT} ssl;
    listen [::]:${HTTPS_PORT} ssl;
    server_name ${BASE_URL};

    include snippets/ssl-params.conf;
    include snippets/self-signed.conf;

    location /api {
        add_header X-Forwarded-Prefix /api;
        proxy_pass http://annotator-api:${API_PORT};
        include snippets/proxy.conf;
    }
    location /auth {
        add_header X-Forwarded-Prefix /auth;
        proxy_pass http://annotator-oauth:${OAUTH_PORT};
        include snippets/proxy.conf;
    }
    location / {
        proxy_pass http://annotator-web:80;
        include snippets/proxy.conf;
    }
}

server {
    listen ${HTTP_PORT};
    listen [::]:${HTTP_PORT};
    server_name ${BASE_URL};

    return 302 https://$server_name:${HTTPS_PORT}$request_uri;
}
