name: Build, lint and test API
on: workflow_call
defaults:
  run:
    working-directory: ./server
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'adopt'

      - name: Compile project
        run: ./mvnw -f ./pom.xml clean compile
