name: Deploy main branch to server
on:
  workflow_call:
    secrets:
      SSH_KEY:
        required: true
      HOST:
        required: true
      USER:
        required: true
      DIR_NAME:
        required: true
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 ${{ secrets.HOST }} >> ~/.ssh/known_hosts
          sudo apt-get install sshpass

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.USER }}@${{ secrets.HOST }} <<'ENDSSH'
          cd "${{ secrets.DIR_NAME }}"
          sudo docker compose down
          git pull
          sudo docker compose up --build --detach
          ENDSSH
